spring.application.name=servicio-catalogo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
catedra.api.url=${CATEDRA_API_URL:}
catedra.jwt=${CATEDRA_JWT:}
catedra.redis.host=${CATEDRA_REDIS_HOST:}
catedra.redis.port=${CATEDRA_REDIS_PORT:}
catedra.redis.username=${CATEDRA_REDIS_USERNAME:}
catedra.redis.password=${CATEDRA_REDIS_PASSWORD:}
catedra.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.consumer-group=${CATEDRA_KAFKA_CONSUMER_GROUP:}
catedra.kafka.topic-catalogo=${CATEDRA_KAFKA_TOPIC_CATALOGO:}
