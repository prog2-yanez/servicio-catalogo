spring.application.name=servicio-catalogo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
catedra.api.url=${CATEDRA_API_URL:}
catedra.api.timeout-conexion=5s
catedra.api.timeout-lectura=30s
catedra.jwt=${CATEDRA_JWT:}
spring.data.redis.host=${CATEDRA_REDIS_HOST:localhost}
spring.data.redis.port=${CATEDRA_REDIS_PORT:6379}
spring.data.redis.username=${CATEDRA_REDIS_USERNAME:}
spring.data.redis.password=${CATEDRA_REDIS_PASSWORD:}
spring.data.redis.timeout=5s
management.health.redis.enabled=false
catedra.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.consumer-group=${CATEDRA_KAFKA_CONSUMER_GROUP:}
catedra.kafka.topic-catalogo=${CATEDRA_KAFKA_TOPIC_CATALOGO:}
spring.kafka.bootstrap-servers=${catedra.kafka.bootstrap-servers}
spring.kafka.consumer.group-id=${catedra.kafka.consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
jwt.secreto=${JWT_SECRETO:}
cors.origenes-permitidos=${CORS_ORIGENES_PERMITIDOS:}
